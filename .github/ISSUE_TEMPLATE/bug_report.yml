name: Bug report / 问题反馈
description: Report a reproducible problem.
body:
  - type: input
    id: versions
    attributes:
      label: Minecraft, loader and mod versions
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps, expected result and actual result
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs and screenshots
      description: Remove private addresses, player information and credentials before attaching logs.
