name: Build
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - platform: fabric
            java: '21'
          - platform: forge
            java: '21'
          - platform: neoforge
            java: '21'
          - platform: neoforge-26.1
            java: '25'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: gradle/actions/setup-gradle@v4
      - name: Check public resources
        run: python tools/verify_public.py
      - name: Build
        run: sh ${{ matrix.platform }}/gradlew -p ${{ matrix.platform }} --no-daemon build
      - name: Core regression checks
        run: sh ${{ matrix.platform }}/gradlew -p ${{ matrix.platform }} --no-daemon verifyLogic verifyPrediction verifyPower
      - name: Native Vorbis decoder checks
        if: matrix.platform == 'fabric'
        run: sh fabric/gradlew -p fabric --no-daemon verifyVorbis
      - name: Validate installable JAR
        run: python tools/verify_public.py $(find ${{ matrix.platform }}/build/libs -maxdepth 1 -name 'monsoonstory_billiards-*.jar' ! -name '*-sources.jar' ! -name '*-dev.jar' ! -name '*-verification*.jar')
      - name: Music transfer regression checks
        if: matrix.platform == 'fabric'
        shell: pwsh
        run: ./tools/test_music.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: monsoonstory-billiards-${{ matrix.platform }}
          path: ${{ matrix.platform }}/build/libs/*.jar
